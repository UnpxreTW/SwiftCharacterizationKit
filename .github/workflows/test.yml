name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    # CHARACTERIZATION_RECORD 絕不在此設定——CI 只驗 golden、不錄 golden。
    env:
      SWIFTSTYLELINT_STRICT: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Pin Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: swift test（macOS）
        run: swift test
      - name: xcodebuild test（iOS Simulator）
        # -skipPackagePluginValidation：理由同 build.yml。
        run: xcodebuild test -scheme SwiftCharacterizationKit-Package -destination 'platform=iOS Simulator,OS=26.3,name=iPhone 17' -skipPackagePluginValidation
